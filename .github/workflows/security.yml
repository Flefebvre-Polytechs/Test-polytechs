name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated CI hosting configuration
        # Production Site metadata is intentionally absent from the public mirror.
        # Only binding names are needed for type checking; no production identifier.
        run: |
          mkdir -p .openai
          if [ ! -f .openai/hosting.json ]; then
            printf '%s\n' '{"d1":"DB","r2":"BUCKET"}' > .openai/hosting.json
          fi
      - run: pnpm exec tsc --noEmit --incremental false
      - name: Install Excel export test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/qse-test-python"
          "$RUNNER_TEMP/qse-test-python/bin/python" -m pip install openpyxl==3.1.5 et-xmlfile==2.0.0
          echo "$RUNNER_TEMP/qse-test-python/bin" >> "$GITHUB_PATH"
      - name: Application and security regression tests
        run: |
          for test in tests/*.mjs; do node "$test"; done
      - run: pnpm audit --prod --audit-level=low
